{% extends "base.html" %}

{% block content %}
<div class="edit-container">
    <h2>Редактирование расписания</h2>
    
    <div class="schedule-controls">
        <form method="GET" class="day-selector">
            <label>День недели:</label>
            <select name="day" onchange="this.form.submit()">
                {% for i in range(days|length) %}
                    <option value="{{ i }}" {% if i == current_day %}selected{% endif %}>{{ days[i] }}</option>
                {% endfor %}
            </select>
        </form>

        <form method="GET" class="class-selector">
            <input type="hidden" name="day" value="{{ current_day }}">
            <label>Класс/Группа:</label>
            <select name="class" onchange="this.form.submit()">
                <option value="all" {% if current_class == 'all' %}selected{% endif %}>Все</option>
                <option value="5A" {% if current_class == '5A' %}selected{% endif %}>5А</option>
                <option value="6B" {% if current_class == '6B' %}selected{% endif %}>6Б</option>
                <option value="7A" {% if current_class == '7A' %}selected{% endif %}>7А</option>
                <option value="8B" {% if current_class == '8B' %}selected{% endif %}>8Б</option>
                <option value="9A" {% if current_class == '9A' %}selected{% endif %}>9А</option>
                <option value="10" {% if current_class == '10' %}selected{% endif %}>10 класс</option>
                <option value="11" {% if current_class == '11' %}selected{% endif %}>11 класс</option>
            </select>
        </form>
    </div>

    <form method="POST" class="edit-form">
        <input type="hidden" name="day" value="{{ current_day }}">
        <input type="hidden" name="class_group" value="{{ current_class }}">
        <input type="hidden" name="lesson_count" value="8" id="lesson_count">

        <div class="lessons-edit">
            {% for i in range(1, 9) %}
            <div class="lesson-edit-row">
                <div class="lesson-number">{{ i }}</div>
                <div class="lesson-fields">
                    <input type="text" name="subject_{{ i }}" placeholder="Предмет"
                           value="{% if lessons %}{% if i <= lessons|length %}{{ lessons[i-1].subject }}{% endif %}{% endif %}">
                    <input type="text" name="teacher_{{ i }}" placeholder="Учитель"
                           value="{% if lessons %}{% if i <= lessons|length %}{{ lessons[i-1].teacher }}{% endif %}{% endif %}">
                    <input type="text" name="classroom_{{ i }}" placeholder="Кабинет"
                           value="{% if lessons %}{% if i <= lessons|length %}{{ lessons[i-1].classroom }}{% endif %}{% endif %}">
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Сохранить изменения</button>
            <a href="{{ url_for('schedule') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
